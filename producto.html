<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER ODYSSEY 2077 - Tienda de Videojuegos</title>
</head>
<body>

    <!-- Navegación -->
    <header>
        <div class="logo">⚡ GAMESTORE</div>
        <ul class="nav-links">
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Catálogo</a></li>
            <li><a href="#">Ofertas</a></li>
            <li><a href="#">Soporte</a></li>
        </ul>
    </header>

    <!-- Ruta de navegación (Breadcrumbs) -->
    <nav class="breadcrumb">
        <a href="#">Inicio</a> &gt; <a href="#">Juegos de Acción</a> &gt; <span>Cyber Odyssey 2077</span>
    </nav>

    <!-- Contenedor Principal del Producto -->
    <main class="product-container">
        
        <!-- Galería de Imágenes mediante CSS Radio Inputs -->
        <section class="gallery-container">
            <!-- Radios de control ocultos -->
            <input type="radio" name="gallery" id="img-1" class="gallery-input" checked>
            <input type="radio" name="gallery" id="img-2" class="gallery-input">
            <input type="radio" name="gallery" id="img-3" class="gallery-input">
            <input type="radio" name="gallery" id="img-4" class="gallery-input">

            <!-- Visor de imagen grande (Imágenes de la versión inicial) -->
            <div class="main-image-viewport">
                <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80" alt="Cyber Odyssey Gameplay 1" class="img-1">
                <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=800&q=80" alt="Cyber Odyssey Gameplay 2" class="img-2">
                <img src="https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=800&q=80" alt="Cyber Odyssey Gameplay 3" class="img-3">
                <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=800&q=80" alt="Cyber Odyssey Gameplay 4" class="img-4">
            </div>

            <!-- Miniaturas para seleccionar imagen mediante etiquetas label -->
            <div class="thumbnails">
                <label for="img-1" class="thumbnail-label">
                    <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=200&q=80" alt="Vista previa 1">
                </label>
                <label for="img-2" class="thumbnail-label">
                    <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=200&q=80" alt="Vista previa 2">
                </label>
                <label for="img-3" class="thumbnail-label">
                    <img src="https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=200&q=80" alt="Vista previa 3">
                </label>
                <label for="img-4" class="thumbnail-label">
                    <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=200&q=80" alt="Vista previa 4">
                </label>
            </div>
        </section>

    <!-- Pie de página -->
    <footer>
        <p>&copy; 2026 GameStore Inc. Todos los derechos reservados. HTML & CSS Puro.</p>
    </footer>

</body>
</html>
